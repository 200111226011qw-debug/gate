name: VPN Gate Node Check

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # 关键: 用 python -m pip 安装, 保证「装依赖的解释器」和「跑脚本的解释器」是同一个。
      # 旧写法 `pip install -r requirements.txt` 依赖 PATH 顺序, 一旦 pip 落到另一个解释器上,
      # 下一步 `python vpngate.py` 会在 import requests 时瞬间退出 (退出码 1, 步骤耗时 0 秒)。
      - name: Install dependencies
        run: |
          python -V
          python -m pip -V
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -c "import requests, sys; print('依赖自检通过: requests', requests.__version__, '| python', sys.version.split()[0])"

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          # Worker 上游有免费额度限制: 实测 32 并发会大面积返回 429 -> success=false (被误判成节点不通),
          # 因此并发降到 4, 并允许检测服务异常时重试。
          CHECK_CONCURRENCY: "4"
          CHECK_TIMEOUT: "60"
          CHECK_RETRIES: "2"
          CHECK_BACKOFF: "2"
          CHECK_MIN_INTERVAL: "0.25"
          # 数据源重试 (官方 API 抖动时自动重试, 再回退到 GitHub 镜像)
          FETCH_RETRIES: "3"
          FETCH_BACKOFF: "3"
          # 可用节点少于该值时, 若上一版更多则保留上一版 (避免把订阅改差)
          MIN_SUCCESS: "5"
          # 想要「降级也把这次运行标红」就把下一行打开
          # STRICT: "1"

      # 无论成功 / 降级 / 失败都打印关键产物与结论, 一眼定位问题
      - name: 运行结果汇总
        if: always()
        run: |
          echo "job status: ${{ job.status }}"
          if [ -f public/status.json ]; then
            echo "---------- public/status.json ----------"
            cat public/status.json
          else
            echo "public/status.json 不存在 (脚本在生成产物前就退出了)"
          fi
          if [ -f public/nodes.txt ]; then
            echo "---------- public/nodes.txt 前 3 行 (共 $(wc -l < public/nodes.txt) 行) ----------"
            head -n 3 public/nodes.txt
          else
            echo "public/nodes.txt 不存在"
          fi

      - name: Sync Check Worker script (auto-update every run)
        run: |
          mkdir -p public
          if curl -fsSL --retry 2 -o public/check-worker.js \
            "https://raw.githubusercontent.com/lsh8848/cm-Workers-CheckSocks5/refs/heads/main/_worker.js"; then
            echo "检测 Worker 脚本已同步: $(wc -c < public/check-worker.js) bytes"
          else
            # runner 是全新目录且 public/ 不入库, 同步失败时本轮产物里就是没有 check-worker.js,
            # 不存在「旧副本」可沿用 —— 检查 Worker 已部署的实例不受影响, 只影响网页取最新脚本的入口
            echo "警告: 检测 Worker 脚本同步失败, 本轮产物不含 check-worker.js (不影响 nodes.txt 生成)"
          fi

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (build_type = workflow)"
            # 创建 Pages 站点必须用 POST —— PUT 只能「更新已存在的站点」, 对未开启 Pages 的
            # 仓库同样返回 404, 旧写法导致本步骤从未真正开启过 Pages (2026-10-24 修)。
            # build_type=workflow 时不需要也不能带 source (branch/path 是 legacy 模式的参数)。
            # 注意: GITHUB_TOKEN 没有 administration 权限可用 (workflow permissions 不支持该键),
            # 若仓库设置不允许 token 开启 Pages, 下面会拿到 4xx —— 打明确告警引导手动开启, 不静默。
            http=$(curl -sS -o "$RUNNER_TEMP/pages-create.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
            if [ "$http" = "201" ] || [ "$http" = "204" ]; then
              echo "Pages 已开启 (HTTP $http)"
            else
              echo "::warning::自动开启 Pages 失败 (HTTP $http): $(cat "$RUNNER_TEMP/pages-create.json") — 请到仓库 Settings → Pages 手动将 Source 设为 GitHub Actions"
            fi
            echo
            sleep 10
          elif [ "$code" = "403" ]; then
            # 防御性分支: token 连「查询 Pages 状态」都不允许时, 至少把这件事说出来,
            # 不让「跳过创建」被误读成「Pages 已就绪」。
            echo "::warning::查询 Pages 状态返回 403 (token 无权限) — 无法自动确认/开启 Pages, 请手动到 Settings → Pages 检查 Source 是否为 GitHub Actions"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 心跳状态 (死链证据 / 采样游标 / 时序记录) 不是 vpngate.py 的产物, 而 Pages 部署是
      # **整站替换**: public/ 里没有的文件, 部署完就从线上消失了。不在这里把它们搬回来,
      # 每次 check 发布都会把心跳的证据清零 —— 「连续 2 轮确认才摘」在节点数稍大时
      # (覆盖一轮超过 6 小时) 就永远凑不齐, 表现为心跳每小时都在跑、从来不摘任何节点。
      - name: Preserve heartbeat state
        run: |
          mkdir -p public
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          for f in heartbeat.json heartbeat-history.jsonl; do
            if curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
              -o "public/$f" "$base/$f?t=$(date +%s)"; then
              echo "已保留 $f ($(wc -c < "public/$f") bytes)"
            else
              # 取不到就删掉半截文件: 宁可让心跳从空状态重新积累, 也不要发布一个损坏的 JSON
              rm -f "public/$f"
              echo "线上暂无 $f (首轮 / 从未跑过心跳), 跳过"
            fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show site URL
        # 按仓库动态拼接 (fork / 改名后自动正确): owner 取 GITHUB_REPOSITORY_OWNER,
        # 仓库名从 GITHUB_REPOSITORY (形如 owner/repo) 里剥掉 owner/ 前缀。
        run: 'echo "site: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ (deploy outcome: ${{ steps.deployment.outcome }})"'
